<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Try Out TKA Bahasa Indonesia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: layar mulai (form) -> layar ujian (soal kiri, panel nomor kanan) -> layar hasil (skor + pembahasan) */
:root{
  --bg:#f3f1ff; --surface:#ffffff; --surface2:#f7f6ff; --fg:#1d1b3a; --muted:#6a6791; --line:#e0ddf5;
  --brand:#5b3df5; --brand2:#8b5cf6; --brand-ink:#ffffff; --brand-soft:#ebe7ff;
  --ok:#0e9f6e; --ok-soft:#d9f6ea; --ok-ink:#ffffff;
  --doubt:#f59e0b; --doubt-soft:#fff1cf; --doubt-ink:#2b1d00;
  --bad:#e5484d; --bad-soft:#ffe1e2;
  --blank:#ffffff; --blank-line:#cfcaf0;
  --hero1:#4326d9; --hero2:#7c4dff; --hero3:#17c3b2;
  --shadow:0 10px 30px -12px rgba(67,38,217,.35);
  --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12102a; --surface:#1c1940; --surface2:#231f4d; --fg:#eeecff; --muted:#a29fcc; --line:#322e68;
  --brand:#8f78ff; --brand2:#a78bfa; --brand-ink:#12102a; --brand-soft:#2b2660;
  --ok:#2dd4a0; --ok-soft:#10382f; --ok-ink:#06231b;
  --doubt:#fbbf24; --doubt-soft:#41320c; --doubt-ink:#2b1d00;
  --bad:#ff7a80; --bad-soft:#4a1d24;
  --blank:#1c1940; --blank-line:#4a4590;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12102a; --surface:#1c1940; --surface2:#231f4d; --fg:#eeecff; --muted:#a29fcc; --line:#322e68;
  --brand:#8f78ff; --brand2:#a78bfa; --brand-ink:#12102a; --brand-soft:#2b2660;
  --ok:#2dd4a0; --ok-soft:#10382f; --ok-ink:#06231b;
  --doubt:#fbbf24; --doubt-soft:#41320c; --doubt-ink:#2b1d00;
  --bad:#ff7a80; --bad-soft:#4a1d24;
  --blank:#1c1940; --blank-line:#4a4590;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:12px;
  padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--brand)}
.btn-doubt{background:var(--doubt-soft);border-color:var(--doubt);color:var(--fg)}
.btn-doubt[aria-pressed="true"]{background:var(--doubt);color:var(--doubt-ink)}
.btn-ok{background:var(--ok);color:var(--ok-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- start ---------- */
.hero{border-radius:28px;padding:clamp(24px,5vw,48px);color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(900px 400px at 100% 0,var(--hero3) -20%,transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2))}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 14px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,5.5vw,54px);font-weight:800;margin:14px 0 10px;color:#fff}
.hero p{margin:0;max-width:56ch;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.facts span{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px}
.start-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px)}
.card h2{font-size:22px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.field .err{color:var(--bad);font-size:13px;min-height:0}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start}
.chip{width:26px;height:26px;border-radius:8px;flex:none;border:2px solid var(--blank-line);background:var(--blank)}
.chip.ok{background:var(--ok);border-color:var(--ok)}.chip.dt{background:var(--doubt);border-color:var(--doubt)}
.chip.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.resume{background:var(--doubt-soft);border:2px solid var(--doubt);border-radius:14px;padding:14px 16px;margin-bottom:16px}

/* ---------- exam ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:12px 18px;box-shadow:var(--shadow)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.who{min-width:0}.who b{display:block;font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
.who small{opacity:.85}
.timer{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 16px;font-variant-numeric:tabular-nums}
.timer b{font-family:var(--display);font-size:26px;letter-spacing:.03em}
.timer small{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.timer.low{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--hero3),var(--brand2));width:0;transition:width .3s}
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qno{font-family:var(--display);font-weight:800;font-size:20px;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:4px 14px}
.badge{font-size:13px;font-weight:700;border-radius:99px;padding:3px 12px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.dt{background:var(--doubt-soft);color:var(--fg);border:1px solid var(--doubt)}.badge.bl{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.stim-intro{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.stim{background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:14px;padding:14px 18px;margin:0 0 16px;font-size:15.5px}
.stim p{margin:0 0 .5em}.stim p:last-child{margin:0}
.stim u,.q u{text-decoration-thickness:2px}
.q{font-size:18px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand2)}
.opt .l{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--brand-soft);color:var(--brand)}
.opt span.t{min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-checked="true"] .l{background:var(--brand);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:20px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nb{aspect-ratio:1;min-height:44px;border-radius:12px;border:2px solid var(--blank-line);background:var(--blank);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.nb.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.nb.dt{background:var(--doubt);border-color:var(--doubt);color:var(--doubt-ink)}
.nb.cur{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--brand)}
.nb.good{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.nb.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.nb.empty{background:var(--surface2);color:var(--muted)}
.legend{display:grid;gap:8px;margin:16px 0;font-size:14px}
.legend div{display:flex;align-items:center;gap:10px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend .chip{width:20px;height:20px;border-radius:6px}
.finish{width:100%;margin-top:6px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(18,16,42,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.modal h3{font-size:24px;margin-bottom:10px}
.modal .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.modal .row .btn{flex:1 1 140px}
.sumlist{display:grid;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.sumlist li{display:flex;justify-content:space-between;background:var(--surface2);border-radius:10px;padding:8px 12px}

/* ---------- result ---------- */
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,4vw,40px);align-items:center;color:#fff;border-radius:28px;padding:clamp(22px,4vw,40px);
  background:radial-gradient(800px 360px at 0 100%,var(--hero3) -30%,transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2))}
.score{width:clamp(150px,24vw,220px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.55)}
.score b{font-family:var(--display);font-size:clamp(48px,9vw,82px);font-weight:800;line-height:1;display:block}
.score small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.res-hero h1{font-size:clamp(24px,4vw,38px);color:#fff;overflow-wrap:anywhere}
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.idgrid div{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;min-width:0}
.idgrid small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.idgrid b{overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{border-radius:16px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.stat b{font-family:var(--display);font-size:32px;display:block;line-height:1.1}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}.stat.bl b{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.rev{margin-bottom:16px}
.rev .opt{cursor:default}.rev .opt:hover{border-color:var(--line)}
.opt.key{border-color:var(--ok);background:var(--ok-soft)}.opt.key .l{background:var(--ok);color:var(--ok-ink)}
.opt.mine{border-color:var(--bad);background:var(--bad-soft)}.opt.mine .l{background:var(--bad);color:#fff}
.opt .tagr{margin-left:auto;flex:none;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;align-self:center}
.opt.key .tagr{background:var(--ok);color:var(--ok-ink)}.opt.mine .tagr{background:var(--bad);color:#fff}
.pemb{margin-top:14px;background:var(--brand-soft);border-radius:14px;padding:14px 18px}
.pemb h4{margin:0 0 6px;font-family:var(--display);font-size:16px;color:var(--brand)}
.pemb p{margin:0}
.topbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.theme{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:15;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;box-shadow:var(--shadow)}

@media (max-width:860px){
  .start-grid,.exam-grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .navgrid{grid-template-columns:repeat(10,1fr);gap:5px}
  .nb{min-height:34px;border-radius:9px;font-size:13px}
  .res-hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
}
@media (max-width:520px){
  .actions{grid-template-columns:1fr 1fr}.actions .mid{grid-column:1/-1;order:3}
  .navgrid{grid-template-columns:repeat(8,1fr)}
  .q{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const QUESTIONS = [{"no": 1, "stimulus": {"intro": "Cermatilah kutipan novel berikut!", "blocks": [["box", ["&quot;Belajar apaan?&quot; Sam memandang Ali dengan pertanyaan.<br>&quot;Belajar berbakti. Belajar berbakti kepada orang yang telah membesarkanku.&quot;<br>&quot;<i>God wil angry if you not do it, isn&#x27;t it?<\/i>&quot;<br>Ali berdehem seraya tersenyum lebar, tetapi lebih tampak seperti menahan gelak tawa. &quot;Ini mah kewajiban yang dapat dilakukan nanti.&quot;<br>&quot;<i>And God will give you a heaven if you do it?<\/i>&quot;<br>&quot;Berbakti pada orang tua mutlak harus dilakukan, Sam. Jasa orangtua tak terbalaskan sampai kapan pun.&quot;"]]]}, "q": "Kalimat resensi berupa kelemahan sesuai dengan kutipan novel tersebut adalah ...", "opts": {"A": "Novel ini sebagian menggunakan bahasa asing sehingga sulit memahami isi cerita.", "B": "Novel ini tidak disukai oleh pembaca karena banyak menggunakan bahasa asing.", "C": "Pengarang kurang jelas mendeskripsikan watak tokoh sehingga sulit dipahami.", "D": "Pembaca novel tidak tertarik membaca novel berbahasa campuran.", "E": "Novel ini tidak menggambarkan persahabatan dua remaja."}, "key": "A", "exp": "Kutipan memuat dialog yang diselingi kalimat berbahasa Inggris tanpa terjemahan. Kelemahan yang dapat dinilai dari kutipan itu adalah penggunaan bahasa asing yang dapat menyulitkan pembaca memahami isi cerita (A). Pilihan B dan D menyatakan reaksi pembaca yang tidak dapat dibuktikan dari kutipan, C dan E tidak sesuai isi kutipan.", "pemAns": "A"}, {"no": 2, "stimulus": {"intro": "Cermati kutipan berikut untuk menjawab soal nomor 2 dan 3!", "blocks": [["box", ["Bagi nenek, wibawa harus terus dijaga agar orang di luar <i>griya<\/i> mau menghargainya. Kenyataannya? Memang nenek bisa mengatur keluarga. Bahkan Ida Bagus Tugur, suaminya, takkan berkutik hanya dengan batuk kecil. Anehnya, nenek hanya pandai membaca kesalahan-kesalahan yang dibuat suaminya. Tapi dia tidak lihai membaca kesalahan anak kesayangannya, anak lelaki satu-satunya yang teramat dia kagumi dan terlalu sering membuat masalah itu."]]]}, "q": "Pendeskripsian watak tokoh <i>nenek yang keras kepala<\/i> dalam kutipan novel tersebut diungkapkan melalui ....", "opts": {"A": "situasi sekitar tokoh", "B": "gambaran fisik tokoh", "C": "tingkah laku tokoh", "D": "tanggapan tokoh lain", "E": "uraian pengarang"}, "key": "C", "exp": "Sifat keras kepala nenek tidak dinyatakan langsung, melainkan tampak dari perbuatannya: selalu menjaga wibawa, mengatur keluarga sampai suaminya tidak berkutik, hanya mempersalahkan suami, dan tidak mau melihat kesalahan anak kesayangannya. Jadi watak itu digambarkan lewat tingkah laku tokoh (C).", "pemAns": "C"}, {"no": 3, "stimulus": {"intro": "Cermati kutipan berikut untuk menjawab soal nomor 2 dan 3!", "blocks": [["box", ["Bagi nenek, wibawa harus terus dijaga agar orang di luar <i>griya<\/i> mau menghargainya. Kenyataannya? Memang nenek bisa mengatur keluarga. Bahkan Ida Bagus Tugur, suaminya, takkan berkutik hanya dengan batuk kecil. Anehnya, nenek hanya pandai membaca kesalahan-kesalahan yang dibuat suaminya. Tapi dia tidak lihai membaca kesalahan anak kesayangannya, anak lelaki satu-satunya yang teramat dia kagumi dan terlalu sering membuat masalah itu."]]]}, "q": "Pembuktian <i>latar suasana tidak nyaman<\/i> dalam kutipan novel tersebut adalah ...", "opts": {"A": "Nenek selalu mempersalahkan suaminya.", "B": "Nenek selalu menjaga wibawanya.", "C": "Nenek tidak bisa mengatur keluarga.", "D": "Cucu nenek sering membuat masalah.", "E": "Suami nenek tidak berkutik dengan batuk kecil."}, "key": "A", "exp": "Suasana tidak nyaman di dalam keluarga itu terbukti dari sikap nenek yang hanya pandai membaca kesalahan suaminya, sehingga suami selalu berada dalam posisi dipersalahkan (A). Pilihan C bertentangan dengan teks (nenek bisa mengatur keluarga), sedangkan D keliru karena yang sering membuat masalah adalah anak lelaki nenek, bukan cucu.", "pemAns": "A"}, {"no": 4, "stimulus": {"intro": "Cermati kutipan cerpen berikut untuk menjawab soal nomor 4 dan 5!", "blocks": [["box", ["Satu jam berlalu, kami terdiam dan terhanyut dalam angan masing-masing. Persoalan yang kami hadapi saat ini benar-benar di luar batas kemampuan. Tapi aku yakin bahwa Tuhan tidak akan memberi cobaan melebihi kemampuan hamba-Nya. Namun, Ranti istriku, tetap ngotot dan terus-menerus mendesakku. Kami masih tetap terdiam, aku berdiri dan berjalan ke sana-ke mari. &quot;Jangan hanya mondar-mandir, Mas, cepat cari jalan keluar, kepalaku rasanya mau copot, lagi pula persoalan ini tidak bisa menunggu, harus segera cari pinjaman karena kalau hujan turun dengan lebat takutnya rumah ini akan rubuh.&quot;"]]]}, "q": "Konflik dalam kutipan cerpen tersebut adalah ....", "opts": {"A": "saling ngotot tidak mau mengalah", "B": "istri yang tidak sabar", "C": "sulit mencari jalan keluar", "D": "butuh pinjaman uang", "E": "suami menyerah pada keadaan"}, "key": "C", "exp": "Konflik adalah persoalan atau pertentangan yang dihadapi tokoh. Kutipan menegaskan bahwa persoalan itu &quot;di luar batas kemampuan&quot; dan istri terus mendesak agar suami &quot;cepat cari jalan keluar&quot;. Jadi konflik yang dihadapi tokoh adalah sulitnya menemukan jalan keluar (C). Kebutuhan pinjaman uang (D) merupakan jalan keluar yang diusulkan, bukan konfliknya.", "pemAns": "C"}, {"no": 5, "stimulus": {"intro": "Cermati kutipan cerpen berikut untuk menjawab soal nomor 4 dan 5!", "blocks": [["box", ["Satu jam berlalu, kami terdiam dan terhanyut dalam angan masing-masing. Persoalan yang kami hadapi saat ini benar-benar di luar batas kemampuan. Tapi aku yakin bahwa Tuhan tidak akan memberi cobaan melebihi kemampuan hamba-Nya. Namun, Ranti istriku, tetap ngotot dan terus-menerus mendesakku. Kami masih tetap terdiam, aku berdiri dan berjalan ke sana-ke mari. &quot;Jangan hanya mondar-mandir, Mas, cepat cari jalan keluar, kepalaku rasanya mau copot, lagi pula persoalan ini tidak bisa menunggu, harus segera cari pinjaman karena kalau hujan turun dengan lebat takutnya rumah ini akan rubuh.&quot;"]]]}, "q": "Keterkaitan isi kutipan cerpen dengan kehidupan sehari-hari adalah ...", "opts": {"A": "Suami biasanya tidak peduli dengan masalah rumah tangga.", "B": "Seorang istri menuntut suami untuk mencari penghasilan tambahan.", "C": "Istri lebih emosional dalam mengatasi permasalahan daripada suami.", "D": "Perlu pinjaman dana yang besar untuk memperbaiki rumah.", "E": "Selalu ada jalan bila kita berusaha untuk memperbaiki rumah yang rubuh."}, "key": "D", "exp": "Dalam kehidupan nyata, rumah yang nyaris rubuh membutuhkan biaya perbaikan yang besar sehingga banyak keluarga terpaksa mencari pinjaman dana, sebagaimana dialami tokoh dalam kutipan (D). Pilihan A bertentangan dengan isi (suami ikut gelisah), sedangkan B, C, dan E merupakan generalisasi yang tidak ditunjang kutipan.", "pemAns": "D"}, {"no": 6, "stimulus": {"intro": "Cermati teks berikut untuk menjawab soal nomor 6 dan 7!", "blocks": [["box", ["Teks 1<br>Seorang kakek hidup serumah bersama anak, menantu, dan cucu berusia 6 tahun. Keluarga itu biasa makan malam bersama. Si kakek yang sudah pikun sering mengacaukan segalanya. Tangan bergetar dan mata rabunnya membuat kakek susah menyantap makanan. Sendok dan garpu kerap jatuh.<br>Saat si kakek meraih gelas, sering susu tumpah membasahi taplak. Anak dan menantunya menjadi gusar. Suami istri itu lalu menempatkan sebuah meja kecil di sudut ruangan, tempat sang kakek makan sendirian. Mereka memberikan mangkuk melamin yang tidak gampang pecah. Saat keluarga sibuk dengan piring masing-masing, sering terdengar ratap kesedihan dari sudut ruangan. Namun, suami-istri itu justru mengomel agar kakek tak menghamburkan makanan lagi.<br>Sang cucu yang baru berusia 6 tahun mengamati semua kejadian itu dalam diam.<br>Suatu hari si ayah memerhatikan anaknya sedang membuat replika mainan kayu.<br>&quot;Sedang apa, sayang?&quot; tanya ayah pada anaknya. &quot;Aku sedang membuat meja buat ayah dan ibu. Persiapan buat ayah dan ibu bila aku besar nanti.&quot; Ayah anak kecil itu langsung terdiam.<br>Ia berjanji dalam hati, mulai hari itu, kakek akan kembali diajak makan di meja yang sama. Tak akan ada lagi omelan saat piring jatuh, makanan tumpah, atau taplak ternoda kuah.<br>Teks 2<br>Di kantin sebuah universitas, Udin dan Tono, dua orang mahasiswa sedang berbincang-bincang.<br>&quot;Saya heran pada dosen ilmu politik, kalau mengajar selalu duduk, tidak pernah mau berdiri,&quot; kata Tono kepada Udin. Udin ogah-ogahan menjawab pertanyaan Tono. Udin beranggapan bahwa masalah yang dibicarakan Tono itu tidak penting.<br>Namun, Tono tetap meminta agar Udin mau menerka teka-tekinya.<br>&quot;Barangkali saja, beliau capek atau kakinya tidak kuat berdiri,&quot; jawab Udin merasa jengah. Ternyata jawaban Udin masih juga salah. Menurut Tono, dosen yang juga pejabat itu tidak bersedia berdiri sebab takut kursinya diambil orang lain.&quot;<br>Mendengar pernyataan Tono, Udin menanyakan apa hubungan antara menjadi dosen dan pejabat.<br>&quot;Ya, kalau dia berdiri, takut kursinya diduduki orang lain,&quot; ungkap Tono."]]]}, "q": "Persamaan kedua teks cerita tersebut adalah ....", "opts": {"A": "menggunakan sudut pandang orang ketiga", "B": "menguraikan watak tokoh kakek dan dosen yang lugu", "C": "konflik tentang masa depan tokoh/kakek dan dosen", "D": "latar cerita di rumah tokoh utama", "E": "tema cerita tentang kesabaran tokoh"}, "key": "A", "exp": "Kedua teks menceritakan tokoh-tokohnya dengan sebutan &quot;ia&quot;, &quot;mereka&quot;, dan nama tokoh (kakek, ayah, Udin, Tono), bukan dengan &quot;aku&quot;. Dengan demikian keduanya memakai sudut pandang orang ketiga (A). Latar (rumah dan kantin), watak, dan tema kedua teks berbeda.", "pemAns": "A"}, {"no": 7, "stimulus": {"intro": "Cermati teks berikut untuk menjawab soal nomor 6 dan 7!", "blocks": [["box", ["Teks 1<br>Seorang kakek hidup serumah bersama anak, menantu, dan cucu berusia 6 tahun. Keluarga itu biasa makan malam bersama. Si kakek yang sudah pikun sering mengacaukan segalanya. Tangan bergetar dan mata rabunnya membuat kakek susah menyantap makanan. Sendok dan garpu kerap jatuh.<br>Saat si kakek meraih gelas, sering susu tumpah membasahi taplak. Anak dan menantunya menjadi gusar. Suami istri itu lalu menempatkan sebuah meja kecil di sudut ruangan, tempat sang kakek makan sendirian. Mereka memberikan mangkuk melamin yang tidak gampang pecah. Saat keluarga sibuk dengan piring masing-masing, sering terdengar ratap kesedihan dari sudut ruangan. Namun, suami-istri itu justru mengomel agar kakek tak menghamburkan makanan lagi.<br>Sang cucu yang baru berusia 6 tahun mengamati semua kejadian itu dalam diam.<br>Suatu hari si ayah memerhatikan anaknya sedang membuat replika mainan kayu.<br>&quot;Sedang apa, sayang?&quot; tanya ayah pada anaknya. &quot;Aku sedang membuat meja buat ayah dan ibu. Persiapan buat ayah dan ibu bila aku besar nanti.&quot; Ayah anak kecil itu langsung terdiam.<br>Ia berjanji dalam hati, mulai hari itu, kakek akan kembali diajak makan di meja yang sama. Tak akan ada lagi omelan saat piring jatuh, makanan tumpah, atau taplak ternoda kuah.<br>Teks 2<br>Di kantin sebuah universitas, Udin dan Tono, dua orang mahasiswa sedang berbincang-bincang.<br>&quot;Saya heran pada dosen ilmu politik, kalau mengajar selalu duduk, tidak pernah mau berdiri,&quot; kata Tono kepada Udin. Udin ogah-ogahan menjawab pertanyaan Tono. Udin beranggapan bahwa masalah yang dibicarakan Tono itu tidak penting.<br>Namun, Tono tetap meminta agar Udin mau menerka teka-tekinya.<br>&quot;Barangkali saja, beliau capek atau kakinya tidak kuat berdiri,&quot; jawab Udin merasa jengah. Ternyata jawaban Udin masih juga salah. Menurut Tono, dosen yang juga pejabat itu tidak bersedia berdiri sebab takut kursinya diambil orang lain.&quot;<br>Mendengar pernyataan Tono, Udin menanyakan apa hubungan antara menjadi dosen dan pejabat.<br>&quot;Ya, kalau dia berdiri, takut kursinya diduduki orang lain,&quot; ungkap Tono."]]]}, "q": "Ringkasan isi cerita pada teks 2 adalah ...", "opts": {"A": "Di kantin sebuah universitas, Udin dan Tono dua orang mahasiswa sedang berbincang-bincang.", "B": "Mendengar pernyataan Tono, Udin menanyakan apa hubungan antara menjadi dosen, kalau dia tidak mau berdiri saat mengajar.", "C": "Teka-teki Tono tentang dosen Udin yang enggan berdiri kalau sedang mengajar di kelas Tono.", "D": "Udin menerka teka-teki Tono, bahwa dosennya barangkali saja capek atau kakinya tidak kuat berdiri.", "E": "Tono meminta agar Udin menerka teka-tekinya tentang sebab dosen ilmu politiknya yang kalau mengajar selalu duduk."}, "key": "E", "exp": "Ringkasan harus memuat inti cerita: Tono bertanya-tanya mengapa dosen ilmu politiknya selalu duduk saat mengajar dan meminta Udin menerka sebabnya. Pilihan E merangkum inti itu. Pilihan A hanya latar, B dan D hanya sebagian peristiwa, dan C salah menyebut dosen Udin.", "pemAns": "E"}, {"no": 8, "stimulus": {"intro": "Cermati kutipan cerpen berikut untuk menjawab soal nomor 8 dan 9!", "blocks": [["box", ["(1) Matahari sedang mencium lembah-lembah gunung ketika aku terbangun di pagi itu. (2) Aku terpaku menikmati pemandangan desa yang sungguh menawan, takkan kutemukan semua ini di hiruk pikuknya kota. (3) Penduduk desa yang masih bersahaja, saling senyum dan bertegur sapa. (4) Mereka bersama-sama turun ke sungai. (5) Sungai yang airnya masih jernih, jauh dari tercemar."]]]}, "q": "Kalimat bermajas pada paragraf tersebut terdapat pada nomor ...", "opts": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "key": "A", "exp": "Kalimat (1) memakai majas personifikasi: matahari digambarkan dapat &quot;mencium&quot; lembah seperti manusia. Kalimat (2)-(5) bermakna lugas.", "pemAns": "A"}, {"no": 9, "stimulus": {"intro": "Cermati kutipan cerpen berikut untuk menjawab soal nomor 8 dan 9!", "blocks": [["box", ["(1) Matahari sedang mencium lembah-lembah gunung ketika aku terbangun di pagi itu. (2) Aku terpaku menikmati pemandangan desa yang sungguh menawan, takkan kutemukan semua ini di hiruk pikuknya kota. (3) Penduduk desa yang masih bersahaja, saling senyum dan bertegur sapa. (4) Mereka bersama-sama turun ke sungai. (5) Sungai yang airnya masih jernih, jauh dari tercemar."]]]}, "q": "Nilai sosial dalam kutipan cerpen tersebut adalah ...", "opts": {"A": "Pemandangan alam desa yang sangat indah di pagi hari.", "B": "Pegunungan yang masih diselimuti awan.", "C": "Kehidupan desa yang bersahaja dengan penduduknya yang ramah.", "D": "Sungai-sungai di desa yang masih jernih jauh dari pencemaran.", "E": "Hiruk pikuk kota yang tidak ditemukan di desa."}, "key": "C", "exp": "Nilai sosial berkaitan dengan hubungan antarmanusia. Kalimat (3) menggambarkan penduduk desa yang bersahaja, saling tersenyum, dan bertegur sapa, yakni keramahan dalam bermasyarakat (C). Pilihan A, B, D, dan E menggambarkan alam, bukan hubungan antarmanusia.", "pemAns": "C"}, {"no": 10, "stimulus": {"intro": "Cermati teks berikut!", "blocks": [["box", ["Manchester kaya akan museum. Salah satunya adalah Imperial War Museum North yang berhasil mengalahkan daya tarik Museum London dengan dukungan teknologi interaktifnya. Sementara itu, Manchester Art Gallery yang baru-baru ini mengalami pemugaran dan perluasan hampir dua kali lipat dari luas sebelumnya, dikenal dengan karya-karya seni Pra-Raphaelite, seni dekoratif seperti kaca, perkakas logam, porselen, perak, dan perabot lainnya. Hal terbaru yang membuat fenomena museum di Manchester makin kuat adalah dibukanya Museum Sepak bola Nasional. Bangunan kaca segitiga ini menyimpan koleksi seragam sepak bola hingga bola Piala Dunia yang ditandatangani serta memorabilia lainnya. Tapi keunggulan utamanya adalah dalam menjelaskan sejarah sepak bola dan pentingnya sepak bola di mata penggemarnya."]]]}, "q": "Penilaian terhadap isi teks tersebut adalah ...", "opts": {"A": "Manchester adalah sebuah kota yang dipenuhi dengan museum yang mempunyai sejarah bertaraf internasional dari berbagai bidang.", "B": "Manchester memang terkenal dengan sepak bolanya yang dipelopori oleh kesebelasan terkenal Manchester United.", "C": "Meskipun namanya Museum Sepak bola Nasional, tetapi isinya adalah sejarah sepak bola dan kesebelasan sepak bola sedunia.", "D": "Perluasan dan pemugaran museum sebagai sarana pengetahuan mutlak diperlukan bila sebuah negara ingin diakui negara lain.", "E": "Kecuali museum seni dan museum olahraga, Manchester juga memiliki museum perang yang sangat lengkap melebihi museum di London."}, "key": "A", "exp": "Teks menyebut Manchester kaya akan museum dari berbagai bidang: museum perang (Imperial War Museum North), seni (Manchester Art Gallery), dan sepak bola (Museum Sepak Bola Nasional). Penilaian yang sesuai dan tidak melebih-lebihkan isi teks adalah A. Pilihan B tidak disebut dalam teks, C dan D menarik kesimpulan berlebihan, dan E melebih-lebihkan (teks hanya menyebut museum itu mengalahkan daya tarik Museum London, bukan lebih lengkap).", "pemAns": "A"}, {"no": 11, "stimulus": {"intro": "Cermati kutipan tajuk rencana untuk menjawab soal nomor 11 dan 12!", "blocks": [["box", ["Harga BBM resmi dinaikkan sebesar dua ribu rupiah pada Senin, 17 November 2014. Kenaikan BBM ini memicu reaksi dari banyak pihak. Kenaikan BBM ini otomatis memengaruhi seluruh harga yang ada di masyarakat, mulai dari harga sembako hingga tarif angkutan umum. Bukan hanya para ibu rumah tangga yang merasakan dampak kenaikan BBM tersebut, pedagang hingga para pelajar pun merasakan efek dari kenaikannya. Ibu rumah tangga kini harus pandai-pandai mengatur keuangan keluarga agar tetap cukup hingga akhir bulan dengan kondisi harga yang semakin mencekik. Para pelajar pun, baik yang menggunakan kendaraan pribadi maupun yang menggunakan angkutan umum untuk ke sekolah, harus mulai mengirit uang jajan mereka.<br>Kenaikan BBM memang telah tersebar luas. Hal tersebut membuat masyarakat menjadi resah dan mengambil tindakan dengan cara menaikkan harga sembako. Saat BBM naik, aksi protes dari mahasiswa pun tak dapat ditahan lagi."]]]}, "q": "Opini penulis dalam kutipan tajuk rencana tersebut adalah ...", "opts": {"A": "Kenaikan BBM memicu keresahan banyak pihak.", "B": "Ibu rumah tangga yang merasakan dampak kenaikan BBM.", "C": "Harga BBM resmi dinaikkan sebesar dua ribu rupiah.", "D": "Aksi protes dari mahasiswa pun tak dapat ditahan lagi.", "E": "Kenaikan BBM mesti disadari demi kesejahteraan rakyat."}, "key": "A", "exp": "Opini adalah pendapat atau penilaian penulis, bukan fakta yang dapat diverifikasi. Pernyataan bahwa kenaikan BBM memicu keresahan banyak pihak merupakan penilaian penulis yang terus diulang dalam tajuk (A). Pilihan B dan C adalah fakta, D adalah laporan peristiwa, dan E tidak terdapat dalam kutipan.", "pemAns": "A"}, {"no": 12, "stimulus": {"intro": "Cermati kutipan tajuk rencana untuk menjawab soal nomor 11 dan 12!", "blocks": [["box", ["Harga BBM resmi dinaikkan sebesar dua ribu rupiah pada Senin, 17 November 2014. Kenaikan BBM ini memicu reaksi dari banyak pihak. Kenaikan BBM ini otomatis memengaruhi seluruh harga yang ada di masyarakat, mulai dari harga sembako hingga tarif angkutan umum. Bukan hanya para ibu rumah tangga yang merasakan dampak kenaikan BBM tersebut, pedagang hingga para pelajar pun merasakan efek dari kenaikannya. Ibu rumah tangga kini harus pandai-pandai mengatur keuangan keluarga agar tetap cukup hingga akhir bulan dengan kondisi harga yang semakin mencekik. Para pelajar pun, baik yang menggunakan kendaraan pribadi maupun yang menggunakan angkutan umum untuk ke sekolah, harus mulai mengirit uang jajan mereka.<br>Kenaikan BBM memang telah tersebar luas. Hal tersebut membuat masyarakat menjadi resah dan mengambil tindakan dengan cara menaikkan harga sembako. Saat BBM naik, aksi protes dari mahasiswa pun tak dapat ditahan lagi."]]]}, "q": "Keberpihakan penulis dalam kutipan tajuk rencana tersebut kepada ....", "opts": {"A": "ibu rumah tangga", "B": "pelajar", "C": "pemerintah", "D": "masyarakat", "E g tulang", "B": "kerja keras", "C": "turun tangan", "D": "berjiwa besar", "E": "berlapang dada"}, "key": "C", "exp": "Pemda diharapkan ikut campur langsung membantu menyelesaikan persoalan harga rotan. Ungkapan yang bermakna ikut campur tangan/membantu secara langsung adalah turun tangan (C). Banting tulang dan kerja keras bermakna bekerja berat, berjiwa besar bermakna lapang pikiran, dan berlapang dada bermakna sabar menerima.", "pemAns": "C"}, {"no": 27, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Pertandingan seru terjadi di Stadion Gelora Bung Karno, kedua tim bermain sangat <i>sportivitas<\/i>. Babak pertama berakhir dengan harga <i>score<\/i> sama kuat, yaitu 0-0. Pada babak kedua, situasi pertandingan semakin meningkat. Banyak peluang dari kedua tim untuk mencetak gol. Hingga akhirnya pada menit ke-85, kiper membuat kesalahan dalam membuang bola dan dimanfaatkan oleh pemain lawan hingga membuahkan hasil, menjadi 1-0. Kondisi tersebut membuat kiper dituding sebagai kambing hitam atas kekalahan yang dialami oleh <i>team<\/i> tersebut."]]]}, "q": "Perbaikan ketiga istilah yang dicetak miring pada paragraf tersebut adalah ....", "opts": {"A": "sporitifitas, sekor, tem", "B": "sportivitas, skor, tim", "C": "sportif, sekor, tem", "D": "sporter, skor, tim", "E": "sportif, skor, tim"}, "key": "E", "exp": "&quot;bermain sangat sportivitas&quot; salah karena sportivitas adalah kata benda; bentuk yang tepat sebagai keterangan cara adalah sportif. &quot;Score&quot; diserap menjadi skor, dan &quot;team&quot; menjadi tim. Maka perbaikannya: sportif, skor, tim (E).", "pemAns": "E"}, {"no": 28, "stimulus": {"intro": "Cermati kalimat berikut!", "blocks": [["box", ["Gedung itu dibangun di atas lahan seluas 1,732 meter persegi dengan biaya sebesar Rp2,95 triliun."]]]}, "q": "Kesalahan tanda baca koma (,) pada kalimat tersebut beserta alasannya adalah ...", "opts": {"A": "Penulisan <i>Rp 2,95 triliun<\/i> karena menyatakan jumlah uang menggunakan tanda koma dan angka 00 di belakang jumlah.", "B": "Penulisan <i>1,732 meter<\/i> karena untuk menunjukkan jumlah digunakan tanda titik setiap tiga angka dari belakang.", "C": "Penulisan <i>Rp 2,95 triliun<\/i> karena hanya terdiri atas tiga angka sehingga tidak memerlukan tanda baca.", "D": "Penulisan <i>1,732 meter<\/i> karena untuk menunjukkan jumlah tidak diperlukan tanda baca apapun.", "E": "Penulisan <i>Rp 2,95 triliun<\/i> karena kata rupiah merupakan singkatan harus diikuti tanda titik."}, "key": "B", "exp": "Dalam PUEBI, tanda titik dipakai untuk memisahkan ribuan, jutaan, dan seterusnya yang menunjukkan jumlah (bukan pecahan). Luas lahan &quot;1,732 meter&quot; seharusnya ditulis 1.732 meter persegi. Penulisan Rp2,95 triliun sudah benar karena koma di situ menandai pecahan desimal.", "pemAns": "B"}, {"no": 29, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["(1)Warga Bukit Duri, Kecamatan Tebet, Jakarta Selatan yang menolak direlokasi masih bertahan di rumah mereka. (2)Mereka mengatakan masih sulit meninggalkan rumahnya karena sejak 1960, mereka sudah bermukim di bantaran Kali Ciliwung di Bukit Duri. (3)Mereka menyatakan akan tetap bertahan di rumahnya hingga rumah itu dibongkar. (4)Mereka menolak pindah ke rumah susun sederhana sewa (Rusunawa) rawa Bebek yang menjadi tempat relokasi. (5)Relokasi yang dijalankan Pemprov DKI memang melalui sosialisasi, tetapi hanya sebatas pemberitahuan."]]]}, "q": "Penulisan nama geografi yang salah pada paragraf tersebut terdapat pada kalimat nomor ....", "opts": {"A": "(1)", "B": "(2)", "C": "(3)", "D": "(4)", "E": "(5)"}, "key": "D", "exp": "Nama geografi (nama diri tempat) ditulis dengan huruf awal kapital pada setiap unsurnya. Pada kalimat (4), &quot;rawa Bebek&quot; seharusnya &quot;Rawa Bebek&quot;. Penulisan nama geografi pada kalimat (1) dan (2) sudah benar.", "pemAns": "D"}, {"no": 30, "stimulus": {"intro": "Cermati teks berikut!", "blocks": [["box", [""]]]}, "q": "Pengembangan topik dan kata kunci ke dalam bentuk cerpen yang tepat adalah ...", "opts": {"A": "Ia hanya pegawai biasa di sebuah kantor pemerintah. Rumahnya megah di kawasan elit, tetapi orang-orang hanya tahu pegawai itu orang sederhana karena ketika pergi ke kantor dia naik angkot. Masyarakat kaget ketika pegawai tersebut dijebloskan ke penjara dan dituntut hukuman seumur hidup.", "B": "Pegawai itu hanya pegawai biasa di sebuah kantor pemerintah. Dia dituduh korupsi karena mempunyai rumah mewah di kawasan elit. Padahal hidupnya sangat sederhana. Pergi dan pulang kerja dia selalu menggunakan angkot. Rumah mewah itu sesungguhnya adalah rumah warisan dari orangtuanya.", "C": "Jabatan pegawai itu cukup tinggi, jadi wajar kalau dia mempunyai rumah mewah di kawasan elit. Sebenarnya rumah itu adalah warisan dari orangtuanya tetapi orang-orang tidak percaya karena hidupnya makmur dan bergelimpangan harta.", "D": "Jabatan itu baru saja diembannya, tiba-tiba KPK memeriksa pegawai tersebut dengan tuduhan menggelapkan uang negara. Pegawai tersebut marah dan mencari pengacara terkenal untuk membela diri. Namun, KPK mempunyai bukti-bukti.", "E": "Jabatan pegawai itu awalnya biasa saja, tetapi karena kegigihan dan kerja keras, dia berhasil mendapatkan posisi yang baik di kantornya. Akibatnya banyak yang merasa iri dengan keberhasilannya."}, "key": "B", "exp": "Cerpen yang baik memuat semua kata kunci: pegawai, pemerintah, rumah mewah, sederhana, angkot, warisan, dan dituduh. Hanya pilihan B yang memuat ketujuh kata kunci itu. Pilihan A tidak memuat &quot;warisan&quot; dan &quot;dituduh&quot;, C dan D tidak memuat semua kata kunci (misalnya angkot dan sederhana), dan E menyimpang dari topik.", "pemAns": "B"}, {"no": 31, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Aku menjauhi trotoar, berjalan beberapa langkah dengan wajah tengadah. Lalu dari tengah jalan seraya mengatupkan kedua tangan agar membentuk corong di sekitar mulut, aku berteriak <i>sekeras-keras<\/i>: &quot;Lihat saja, aku bisa lebih dari kalian. Aku bisa, aku pasti bisa!&quot; Semua orang melihatku, tetapi aku tidak peduli. Aku lebih memilih melanjutkan berjalan menuju rumah dengan mata berkaca-kaca, sambil dalam hati memohon, &quot;Ibu, tolong bantu aku.&quot; Dengan perlahan-perlahan, aku berbisik pada diriku sendiri."]]]}, "q": "Perbaikan kata ulang dicetak miring pada paragraf tersebut adalah ....", "opts": {"A": "keras-keras", "B": "sekeras-kerasnya", "C": "sekeras-sekeras", "D": "keras-keraskan", "E": "mengeras-keras"}, "key": "B", "exp": "Bentuk kata ulang yang menyatakan tingkat paling (superlatif) dari kata sifat &quot;keras&quot; adalah &quot;sekeras-kerasnya&quot; (se- + kata ulang + -nya), misalnya &quot;berteriak sekeras-kerasnya&quot;.", "pemAns": "B"}, {"no": 32, "stimulus": {"intro": "Cermati kalimat berikut!", "blocks": [["box", ["Ayah sedang asyik membaca buku yang berjudul &quot;industri rumah tangga dengan pemanfaatan teknologi canggih.&quot;"]]]}, "q": "Penulisan judul karangan yang sesuai dengan ejaan yang diperbaharui adalah ....", "opts": {"A": "Industri Rumah tangga dengan Pemanfaatan Teknologi canggih", "B": "Industri Rumah Tangga Dengan Pemanfaatan Teknologi Canggih", "C": "Industri rumah tangga dengan pemanfaatan teknologi canggih", "D": "Industri Rumah Tangga dengan Pemanfaatan Teknologi Canggih", "E": "Industri Rumah Tangga dengan pemanfaatan teknologi canggih"}, "key": "D", "exp": "Dalam judul karangan, huruf pertama setiap kata ditulis kapital kecuali kata tugas (dan, dengan, yang, di, ke, dari, untuk) yang bukan di awal judul. Jadi yang benar: &quot;Industri Rumah Tangga dengan Pemanfaatan Teknologi Canggih&quot; (D).", "pemAns": "D"}, {"no": 33, "stimulus": {"intro": "Cermati kutipan cerpen berikut!", "blocks": [["box", ["Aku masuk ke dalam kantor dan bersalaman dengan seorang lelaki yang tersenyum-senyum yang bernama Pak Bloecher. Pakaiannya lebih rapi ketimbang pakaianku. Selanjutnya, ia membuka-buka tumpukan kertas, seperti menata kere serambi.<br>&quot;Saya yakin Anda akan puas dengan perjodohan ini, katanya,&quot; Dia telah kami pilih sesuai dengan persyaratan komputer. Tidak ada yang melebihinya dari seratus sepuluh wanita yang memenuhi syarat di Amerika Serikat. Kami memilih berdasarkan suku, agama, etnik, dan latar belakang regional.&quot;"]]]}, "q": "Kalimat esai yang sesuai dengan kutipan cerpen tersebut adalah ...", "opts": {"A": "Novel ini isinya berbobot karena mengungkapkan sesuatu yang tidak lazim dalam masyarakat Indonesia yang pantas kita tiru sebagai bahan perbandingan.", "B": "Budaya Barat yang sifatnya modern sebaiknya perlu kita contoh karena hal ini dapat menambah wawasan masyarakat Indonesia.", "C": "Dialog para pelaku kurang jelas sehingga isi cerita susah dipahami oleh pembaca yang akhirnya tidak tertarik untuk membaca cerita selanjutnya.", "D": "Isi cerita tergolong unik karena mengungkapkan perjodohan melalui biro jodoh, hal ini sangat berbeda dengan budaya atau kebiasaan yang ada dalam masyarakat Indonesia.", "E": "Bahasa yang digunakan tidak wajar dan tidak memenuhi sasaran karena terkesan melebih-lebihkan suatu perjodohan yang seharusnya tidak menjadi bahan publikasi."}, "key": "D", "exp": "Kutipan menceritakan perjodohan lewat biro jodoh yang memakai persyaratan dan seleksi komputer. Hal itu unik dan berbeda dengan kebiasaan perjodohan di masyarakat Indonesia, sehingga esai yang sesuai adalah D. Pilihan A dan B menganjurkan meniru budaya yang tidak disebut dalam kutipan, sedangkan C dan E memuat penilaian yang tidak ditunjang isi kutipan.", "pemAns": "D"}, {"no": 34, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Pesatnya perkembangan iptek telah menggugah keingintahuan masyarakat terhadap sains. Untuk itu, tidaklah mengherankan jika media massa itu terus ... memenuhi kebutuhan pembacanya akan sajian-sajian iptek dengan intensitas dan visi yang berbeda-beda. Setiap media akan ... tulisan-tulisan iptek sesuai dengan selera pembacanya. Namun, dalam fungsinya sebagai media massa, tentulah tulisan-tulisan tersebut ... dengan bahasa dan gaya penulisan populer."]]]}, "q": "Kata berimbuhan yang tepat melengkapi paragraf tersebut adalah ....", "opts": {"A": "mencobakan, disajikan, ditampilkan", "B": "mencoba, menyajikan, ditampilkan", "C": "mencoba, menyajikan, menampilkan", "D": "menyoba, menyaji, menampilkan", "E": "dicoba, disajikan, ditampilkan"}, "key": "B", "exp": "(1) &quot;media massa itu terus mencoba memenuhi kebutuhan pembacanya&quot; memerlukan kata kerja aktif dan bentuk dasar &quot;coba&quot; (mencoba), bukan &quot;mencobakan&quot; atau &quot;menyoba&quot;. (2) &quot;Setiap media akan menyajikan tulisan-tulisan iptek&quot; adalah kalimat aktif. (3) &quot;tulisan-tulisan tersebut ditampilkan dengan bahasa populer&quot; adalah kalimat pasif karena tulisan menjadi subjek yang dikenai pekerjaan.", "pemAns": "B"}, {"no": 35, "stimulus": {"intro": "Cermati kutipan teks drama berikut!", "blocks": [["box", [""]]]}, "q": "Kalimat yang tepat untuk melengkapi teks tersebut adalah ...", "opts": {"A": "Mungkin, itu memang sudah nasibmu. Sekali lagi, saya tidak bisa membantu. Itu bukan lagi urusan menteri seperti saya.", "B": "Menurut data memori yang ada dalam otak saya, rasanya saya belum pernah berjumpa dengan kamu.", "C": "Baiklah, nanti kutemui Bu Pembantu Menteri. Kusampaikan masalahmu kepadanya.", "D": "Kalau cuma masalah uang, aku bisa memberimu sekarang juga.", "E": "Jangan resah. Besok persoalan ini kita selesaikan bersama."}, "key": "A", "exp": "Setelah Parminem mengungkapkan kekecewaannya, Parminem langsung pergi sambil berkata &quot;Nasib, nasib. Ya sudahlah Bu...&quot;. Respons itu menunjukkan bahwa Ibu Menteri menolak membantu. Kalimat yang sesuai dengan alur dan sikap itu adalah A. Pilihan C, D, dan E menawarkan bantuan sehingga Parminem tidak akan pergi dengan putus asa.", "pemAns": "A"}, {"no": 36, "stimulus": {"intro": "Cermati cerita berikut !", "blocks": [["box", ["Teman saya, Fakir, berkaca mata tebal (kadang) sangat menyebalkan. Dengan bentuk tubuh tinggi dan gigi depan yang pecah, ia terbilang bukan orang yang tampan. Setiap keberhasilan dan kebahagiaan orang lain, selalu diberi komentar oleh Fakir. Pokoknya kalau tidak berburuk sangka, ia cenderung melecehkan lawan bicaranya atau sahabat-sahabatnya. Begitulah Fakir."]]]}, "q": "Amanat yang dapat diambil dari cerita tersebut adalah ...", "opts": {"A": "Jangan berprasangka buruk terhadap keberhasilan orang lain!", "B": "Orang yang suka meremehkan orang lain biasanya sombong!", "C": "Orang pendiam belum tentu ia bodoh!", "D": "Hendaklah ramah tamah dalam bergaul!", "E": "Janganlah pura-pura cemburu terhadap keberhasilan orang lain!"}, "key": "A", "exp": "Tokoh Fakir digambarkan selalu berburuk sangka dan melecehkan keberhasilan orang lain. Pesan moral yang dapat dipetik adalah kebalikan dari sikap itu: jangan berprasangka buruk terhadap keberhasilan orang lain (A).", "pemAns": "A"}, {"no": 37, "stimulus": {"intro": "Cermati pantun berikut!", "blocks": [["box", ["Di sebelah ada kebun pepaya<br>Sebelahnya lagi tempat gerabah<br>Yakinlah dan tetap berupaya<br>..."]]]}, "q": "Larik yang tepat untuk melengkapi pantun tersebut adalah ....", "opts": {"A": "Semoga kita mendapat berkah", "B": "Beginilah hati yang gelisah", "C": "Dengan berusaha dan bersedekah", "D": "Beginilah cara orang beribadah", "E": "Pasti ayahlah yang paling susah"}, "key": "A", "exp": "Pantun bersajak a-b-a-b. Larik 1 berakhiran -aya (pepaya), larik 2 berakhiran -ah (gerabah), larik 3 berakhiran -aya (berupaya), maka larik 4 harus berakhiran -ah. Pilihan A (berkah) berima dan isinya sesuai: yakin dan tetap berupaya, semoga mendapat berkah. Pilihan C, D, dan E tidak bersajak -ah tepat atau tidak sesuai isi.", "pemAns": "A"}, {"no": 38, "stimulus": {"intro": "Cermati kalimat berikut!", "blocks": [["box", ["Kalimat argumen :<br>(1) Meningkatkan prestasi siswa merupakan tugas guru dan sekolah.<br>(2) Guru melatih siswa dengan mengerjakan soal-soal untuk menghadapi ujian.<br>(3) Siswa seharusnya memanfaatkan waktu luangnya untuk belajar.<br>(4) Sekolah mengadakan beberapa kali ujicoba ujian nasional agar siswa terlatih menjawab soal.<br>(5) Peran orang tua sangat penting dalam memotivasi siswa."]]]}, "q": "Kalimat argumen yang mendukung kalimat pendapat tersebut adalah ....", "opts": {"A": "(1) dan (2)", "B": "(1) dan (3)", "C": "(2) dan (4)", "D": "(3) dan (5)", "E": "(4) dan (5)"}, "key": "C", "exp": "Pendapat: sekolah berupaya meningkatkan hasil belajar siswa pada ujian nasional. Argumen yang mendukung adalah bukti upaya sekolah, yaitu guru melatih siswa mengerjakan soal (2) dan sekolah mengadakan ujicoba ujian nasional (4). Kalimat (1) berupa pernyataan umum, sedangkan (3) dan (5) berkaitan dengan siswa dan orang tua, bukan upaya sekolah.", "pemAns": "C"}, {"no": 39, "stimulus": {"intro": "Cermatilah teks negosiasi berikut!", "blocks": [["box", [""]]]}, "q": "Hal yang disepakati sesuai dengan isi teks tersebut adalah ...", "opts": {"A": "Bentuk hukuman untuk Tono jika dia kesiangan lagi tiba di sekolah.", "B": "Bu Guru berjanji akan memberi nasihat pada Tono.", "C": "Jam masuk sekolah Tono ditambah dari biasanya.", "D": "Tono sepakat berangkat lebih pagi dari rumah.", "E": "Tono berusaha datang lebih awal di sekolah."}, "key": "D", "exp": "Ibu guru menyarankan agar Tono berangkat lebih pagi (pukul 05.30 atau 05.45), dan Tono menyatakan setuju: &quot;mulai besok saya akan berangkat dari rumah lebih pagi dari biasanya&quot;. Jadi yang disepakati adalah Tono berangkat lebih pagi dari rumah (D).", "pemAns": "D"}, {"no": 40, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Plaza Amabarroso akan menggelar <i>Jogja Fashion Festival (JFF)<\/i> pada bulan Maret 2017. <i>JFF ke-10 ini akan menghadirkan sesuatu yang baru yang mana berupa &quot;fashion show&quot; busana pria dengan memiliki tema Mystique Man.<\/i> Peragaan busana ini akan menjadi salah satu daya tarik pada kegiatan yang digelar untuk meramaikan ulang tahun Plaza Ambarroso Kegiatan kali ini menampilkan peragaan busana pria. Lelaki pun memiliki gaya busana yang tidak kalah menariknya dengan gaya busana wanita."]]]}, "q": "Perbaiki kalimat yang dicetak miring pada paragraf tersebut adalah ...", "opts": {"A": "<i>JFF ke-10 ini dihadirkan dengan sesuatu yang baru yang berupa fashion show busana pria dengan tema Mystique Man.<\/i>", "B": "<i>JFF ke 10 ini menghadirkan sesuatu yang baru berupa fashion show busana pria dengan memiliki tema Mystique Man.<\/i>", "C": "<i>JFF ke sepuluh ini akan hadirkan sesuatu yang baru berupa fashion show busana pria dengan tema Mystique Man.<\/i>", "D": "<i>JFF kesepuluh ini akan menghadirkan fashion show yang baru berupa busana pria dengan tema Mystique Man.<\/i>", "E": "<i>JFF kesepuluh ini akan menghadirkan sesuatu yang baru berupa fashion show dengan bertema Mystique Man.<\/i>"}, "key": "D", "exp": "Kalimat asli tidak efektif karena memuat &quot;yang mana&quot; (pengaruh bahasa asing) dan &quot;dengan memiliki&quot; (mubazir). Pilihan D memperbaiki ketiganya (tanpa &quot;yang mana&quot;, tanpa &quot;dengan memiliki&quot;, dan memakai &quot;dengan tema&quot; serta kata kerja berawalan menghadirkan) sambil mempertahankan informasi busana pria. Pilihan E menghilangkan informasi &quot;busana pria&quot;, A mengubah predikat menjadi pasif, B masih memuat &quot;dengan memiliki&quot;, dan C memakai &quot;hadirkan&quot; tanpa awalan.", "pemAns": "D"}, {"no": 41, "stimulus": {"intro": "Cermati gurindam berikut!", "blocks": [["box", ["Barang siapa berbuat jasa<br>Mudahlah Tuhan mengampuni dosa"]]]}, "q": "Maksud isi gurindam tersebut adalah ...", "opts": {"A": "Siapapun berbuat dosa akan diampuni oleh Tuhan.", "B": "Siapa yang berbuat kebajikan, hidupnya akan bahagia.", "C": "Siapa yang ingin mendapat ampunan harus berbuat baik.", "D": "Orang yang beramal akan diampuni dosanya oleh Tuhan.", "E": "Orang yang dermawan akan disayang Tuhan dan sesama."}, "key": "C", "exp": "Baris pertama merupakan syarat (siapa berbuat jasa/kebaikan) dan baris kedua akibatnya (Tuhan mudah mengampuni dosa). Maksudnya: siapa yang ingin mendapat ampunan harus berbuat baik (C).", "pemAns": "C"}, {"no": 42, "stimulus": {"intro": "Bacalah teks prosedur kompleks berikut!", "blocks": [["box", ["Pemuda harus kembali mengambil peran dalam membawa arah bangsa ini kembali ke relnya. Budaya korupsi yang saat ini telah mengakar harus dihentikan. Bangsa ini membutuhkan pemuda yang sadar akan bahaya laten korupsi dan terkikisnya nilai-nilai kebangsaan. Pemuda harus menjadi pelopor pergerakan melawan korupsi. ..."]]]}, "q": "Kalimat simpulan akibat yang tepat untuk melengkapi paragraf tersebut adalah ...", "opts": {"A": "Indonesia akan menjadi bangsa besar dan bermartabat.", "B": "Korupsi harus diberantas sampai seakar-akarnya.", "C": "Pemerintah harus segera mengambil kebijakan.", "D": "Pelaku korupsi harus dihukum seberat-beratnya.", "E": "Pemuda harus belajar dengan giat."}, "key": "A", "exp": "Simpulan akibat menyatakan hasil dari seluruh uraian sebelumnya: jika pemuda berperan dan memelopori perlawanan terhadap korupsi, maka akibatnya Indonesia akan menjadi bangsa besar dan bermartabat (A). Pilihan B, C, D, dan E berupa keharusan/saran, bukan akibat.", "pemAns": "A"}, {"no": 43, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Pembelajaran Bahasa Indonesia saat ini mulai dikembangkan dengan pendekatan <i>komunikasi<\/i>. Penerapan metode ini akan memberikan tambahan wawasan, baik kepada siswa maupun guru. Peran guru di dalam kelas hanya sebagai <i>fasilitas<\/i> dan <i>motivitas<\/i>, bukan lagi menjadi sumber informasi satu-satunya."]]]}, "q": "Perbaikan kata serapan yang tepat untuk kata bercetak miring adalah ....", "opts": {"A": "komunikasi, fasilitas, motivator", "B": "komunikan, fasilitas, motivasi", "C": "komunikatif, fasilitator, motivasi", "D": "komunikatif, fasilitator, motivator", "E": "komunikan, fasilitas, motivator"}, "key": "D", "exp": "&quot;pendekatan komunikasi&quot; seharusnya pendekatan komunikatif (kata sifat); &quot;peran guru sebagai fasilitas&quot; seharusnya fasilitator (pelaku); dan &quot;motivitas&quot; seharusnya motivator (pelaku yang memberi motivasi). Jadi: komunikatif, fasilitator, motivator (D).", "pemAns": "D"}, {"no": 44, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Diperlukan proses yang panjang untuk menghasilkan kopi luwak yang nikmat. Biji kopi yang benar-benar segar dan berwarna merah yang akan digunakan. ... , biji kopi dipilih dengan memisahkan biji kopi yang segar dan busuk dengan cara direndam. Biji kopi yang baik akan tenggelam, ... yang busuk akan mengapung. ... biji kopi tersebut diberikan kepada musang atau luwak jenis binturong dan bulan (luwak pemakan kopi). Dalam proses ini, luwak mempunyai peran yang sangat penting karena indera penciumannya hanya akan memilih biji kopi yang sempurna."]]]}, "q": "Konjungsi yang tepat untuk melengkapi paragraf tersebut adalah ....", "opts": {"A": "kemudian, karena, sementara", "B": "sementara, bahkan, kemudian", "C": "selanjutnya, sedangkan, kemudian", "D": "kemudian, bahkan, selanjutnya", "E": "jika, sementara, kemudian"}, "key": "C", "exp": "(1) Setelah biji kopi segar disiapkan, langkah berikutnya diawali konjungsi urutan &quot;Selanjutnya&quot;. (2) &quot;Biji kopi yang baik akan tenggelam, sedangkan yang busuk akan mengapung&quot; memerlukan konjungsi pertentangan &quot;sedangkan&quot;. (3) &quot;Kemudian biji kopi tersebut diberikan kepada musang...&quot; menandai tahap berikutnya. Jadi: selanjutnya, sedangkan, kemudian (C).", "pemAns": "C"}, {"no": 45, "stimulus": {"intro": "Cermati kalimat berikut!", "blocks": [["box", ["Jika kecelakaan menimpa Anda saat sendirian di rumah dan mengalami pendarahan, terutama saat masih sadar, segera hentikan pendarahan tersebut. <i>Gunakan handuk atau sejenisnya untuk menghentikan pendarahan.<\/i>"]]]}, "q": "Kalimat tanya yang mempunyai tujuan sama dengan kalimat bercetak miring tersebut adalah ...", "opts": {"A": "Sudahkah Anda menggunakan handuk atau sejenisnya untuk menghentikan pendarahan?", "B": "Apakah Anda sudah menghentikan pendarahan dengan cepat dan tepat?", "C": "Apakah handuk atau sejenisnya dapat menghentikan pendarahan?", "D": "Mengapa handuk atau sejenisnya digunakan untuk menghentikan pendarahan?", "E": "Siapakah yang dapat menghentikan pendarahan pada saat kritis?"}, "key": "A", "exp": "Kalimat miring adalah kalimat perintah (suruhan) agar pembaca menggunakan handuk untuk menghentikan pendarahan. Kalimat tanya yang bertujuan sama (menyuruh/mengingatkan) adalah A, yaitu menanyakan apakah pembaca sudah melakukan tindakan tersebut. Pilihan lain bertanya tentang hal lain (cara, kemampuan, alasan, pelaku).", "pemAns": "A"}, {"no": 46, "stimulus": {"intro": "Cermati Teks Prosedur Kompleks berikut!", "blocks": [["box", ["Proses Pembuatan Kartu Pelajar di Sekolah<br>(1) Datanglah ke kantor TU di sekolah Anda!<br>(2) Mintalah blangko untuk kartu pelajar kepada petugas yang berjaga!<br>(3) ...<br>(4) Setelah blangko selesai Anda isi serahkan kepada petugas yang berjaga!<br>(5) Setelah itu Anda akan memasuki ruang pengambilan foto!<br>(6) Setelah berfoto kartu pelajar akan selesai kurang lebih 2 minggu."]]]}, "q": "Kalimat yang tepat untuk melengkapi teks tersebut adalah ...", "opts": {"A": "Anda boleh memfotokopi blangko yang sudah diisi.", "B": "Isilah blangko dengan data yang benar dan jujur!", "C": "Tempelkan foto di tempat yang disediakan.", "D": "Pergilah ke kepala sekolah untuk meminta tanda tangan!", "E": "Cermati kelengkapan format dalam blangko!"}, "key": "B", "exp": "Langkah (2) adalah meminta blangko dan langkah (4) menyebut &quot;setelah blangko selesai Anda isi&quot;. Maka langkah (3) harus berupa perintah mengisi blangko, yaitu &quot;Isilah blangko dengan data yang benar dan jujur!&quot; (B). Foto baru diambil pada langkah (5).", "pemAns": "B"}, {"no": 47, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Ia mencatat murid yang masih menunggak, menutup buku, kemudian meregangkan badan sambil menguap. Buku dimasukkan ke laci dan mengeluarkan bungkusan dari situ. Ia keluar, pergi ke tepian pangkal jembatan. ... Guru tak mengira daerah ilalang itu dapat ditaklukkan begitu rupa."]]]}, "q": "Kalimat deskriptif yang tepat untuk melengkapi paragraf tersebut adalah ...", "opts": {"A": "Mereka kenal pada Guru, tapi Guru tak kenal mereka satu per satu, hanya tahu bahwa mereka ialah tentara, yang ditempatkan sebanyak satu kompi di situ.", "B": "Sejak zaman Belanda ia sudah menjadi Guru, beberapa kali menjadi pengurus organisasi, jadi penghulu, tapi belum pernah cukup uang untuk membeli sawah.", "C": "Semakin banyak orang yang mencontoh dia membuka kebun karet dan cengkeh di sini akan semakin jauh penduduk Tinjau Laut mencari perhumaan.", "D": "Mereka dahulu meninggalkan daerah perhumaan kemudian pergi ke daerah gunung karena ingin mencari penghidupan yang layak.", "E": "Semak ilalang dekat jembatan yang dulu banyak ditumbuhi <i>cerek-cerek<\/i>, sejenis tumbuhan pemakan serangga, kini telah dibuat huma."}, "key": "E", "exp": "Kalimat sesudah bagian rumpang berbunyi &quot;Guru tak mengira daerah ilalang itu dapat ditaklukkan begitu rupa.&quot; Frasa &quot;daerah ilalang itu&quot; merujuk pada deskripsi tempat tepat sebelumnya. Kalimat deskriptif yang melukiskan keadaan semak ilalang dekat jembatan yang telah dijadikan huma adalah E.", "pemAns": "E"}, {"no": 48, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["(1) Berdasarkan penelitian, tahun ini luas hutan bakau di Indonesia sangat berkurang sekali dibandingkan tahun lalu. (2) Sebagian besar lahan hutan bakau berubah fungsi menjadi tambak udang maupun ikan. (3) Ada pula yang berubah fungsi menjadi wilayah industri maupun permukiman. (4) Selain itu, terjadi penebangan hutan bakau yang sebagian besar digunakan untuk kayu bakar. (5) Hal ini juga menambah parahnya hutan bakau."]]]}, "q": "Perbaiki kalimat yang salah dan alasannya yang tepat adalah ...", "opts": {"A": "<b>Perbaikan:<\/b> Berdasarkan hasil penelitian, tahun ini luas hutan bakau di Indonesia sangat berkurang sekali dibandingkan tahun lalu.<br><b>Alasan:<\/b> Kata penelitian sudah menyatakan hasil.", "B": "<b>Perbaikan:<\/b> Berdasarkan hasil penelitian, tahun ini luas hutan bakau di Indonesia sangat berkurang dibandingkan tahun lalu.<br><b>Alasan:<\/b> Kata sangat sudah bermakna intensitas, tidak perlu kata sekali.", "C": "<b>Perbaikan:<\/b> Sebagian besar lahan hutan bakau berubah fungsi menjadi tambak udang dan ikan.<br><b>Alasan:<\/b> Konjungsi maupun seharusnya berkait dengan konjungsi baik yang menyatakan pilihan.", "D": "<b>Perbaikan:<\/b> Namun, terjadi penebangan hutan bakau yang sebagian besar digunakan untuk kayu bakar.<br><b>Alasan:<\/b> Konjungsi selain itu menyatakan penambahan hal lain, seharusnya pertentangan.", "E": "<b>Perbaikan:<\/b> Selain itu, terjadi penebangan hutan bakau dan sebagian besar digunakan untuk kayu bakar.<br><b>Alasan:<\/b> Konjungsi yang tidak menyatakan penghubung antarklausa."}, "key": "B", "exp": "Kalimat (1) tidak efektif karena memakai &quot;sangat&quot; dan &quot;sekali&quot; sekaligus, padahal keduanya sama-sama menyatakan intensitas (pleonasme). Perbaikan yang benar adalah menghilangkan salah satunya, seperti pada pilihan B. Kalimat (2) dan (4) sudah benar sehingga perbaikan pada C, D, dan E tidak diperlukan.", "pemAns": "B"}, {"no": 49, "stimulus": {"intro": "Cermati kalimat-kalimat berikut!", "blocks": [["box", ["(1) Tidak sedikit kerugian yang dialami, termasuk nyawa manusia juga.<br>(2) Ataukah manusia justru merasa lebih nyaman dengan sikap menghindar dan menyelamatkan diri dengan tidak memberikan solusi yang lebih baik dan lebih tepat lagi?<br>(3) Namun, hal yang perlu dipertanyakan, apakah pengalaman tersebut sudah cukup menyadarkan manusia untuk melihat kesalahan dalam dirinya?<br>(4) Permasalahan seputar lingkungan hidup selalu terdengar mengemuka.<br>(5) Kejadian demi kejadian yang dialami di dalam negeri telah memberikan dampak yang sangat besar."]]]}, "q": "Urutan kalimat yang tepat agar menjadi paragraf padu adalah ....", "opts": {"A": "(1), (3), (4), (2), (5)", "B": "(2), (3), (4), (1), (5)", "C": "(3), (4), (5), (2), (1)", "D": "(4), (3), (1), (5), (2)", "E": "(4), (5), (1), (3), (2)"}, "key": "E", "exp": "Urutan logis: (4) memperkenalkan permasalahan lingkungan hidup; (5) menyebut kejadian demi kejadian yang berdampak besar; (1) menjelaskan dampaknya (kerugian, termasuk nyawa); (3) mempertanyakan apakah pengalaman itu menyadarkan manusia (diawali &quot;Namun&quot;); (2) menutup dengan pertanyaan lanjutan (&quot;Ataukah&quot;). Urutan (4), (5), (1), (3), (2) terdapat pada E.", "pemAns": "E"}, {"no": 50, "stimulus": {"intro": "Cermati paragraf berikut!", "blocks": [["box", ["Pak Bowo terkenal sebagai orang yang baik di desa itu. Dia selalu membantu orang lain tanpa pamrih. Membantu orang tanpa membedakan orang kaya atau miskin. Ketulusan hatinya membuat siapa pun mengaguminya. Apalagi kepada pamanku, yang beberapa tahun silam telah menyelamatkan salah satu anggota keluarganya dari peristiwa perampokan di rumahnya. Pak Bowo benar-benar orang yang tahu diri dan tidak melupakan jasa orang lain. Kami ibarat ..."]]]}, "q": "Peribahasa yang tepat untuk melengkapi paragraf tersebut adalah ...", "opts": {"A": "Hancur badan dikandung tanah, budi baik terkenang juga.", "B": "Menabur benih di tanah yang subur.", "C": "Bagai pungguk merindukan bulan.", "D": "Pucuk dicinta ulam pun tiba.", "E": "Seperti air di daun talas."}, "key": "A", "exp": "Paragraf menggambarkan Pak Bowo yang tidak melupakan jasa orang lain dan dikenang karena budi baiknya. Peribahasa yang bermakna kebaikan seseorang akan selalu dikenang meskipun ia sudah meninggal adalah &quot;Hancur badan dikandung tanah, budi baik terkenang juga&quot; (A). Pilihan lain bermakna berbeda (B: berbuat kebaikan kepada orang yang tepat; C: mengharapkan hal mustahil; D: mendapat yang diinginkan; E: tidak berpendirian).", "pemAns": "A"}];
const TOTAL = QUESTIONS.length, DURATION_MIN = 120, KEY = 'tryout-tka-bindo-v1';
const app = document.getElementById('app');
let S = { stage:'start', student:null, answers:{}, doubt:{}, cur:1, endAt:0, startedAt:0, result:null, filter:'all' };
let tick = null;

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function fmt(sec){ sec=Math.max(0,sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
const stimHTML = q => { const st=q.stimulus; if(!st) return '';
  const body = st.blocks.map(b=> Array.isArray(b) ? b[1].map(x=>`<p>${x}</p>`).join('') : `<p>${b}</p>`).join('');
  return `${st.intro?`<p class="stim-intro">${esc(st.intro)}</p>`:''}<div class="stim">${body}</div>`; };
const status = n => S.doubt[n] ? 'dt' : (S.answers[n] ? 'ok' : 'bl');
const counts = () => { let a=0,d=0; for(let n=1;n<=TOTAL;n++){ if(S.doubt[n]) d++; else if(S.answers[n]) a++; } return {a,d,b:TOTAL-a-d}; };

/* ---------- start ---------- */
function renderStart(){
  const saved = load(); const canResume = saved && saved.stage==='exam' && saved.endAt>Date.now();
  app.innerHTML = `
  <section class="hero">
    <span class="tag">Try Out TKA · Bahasa Indonesia</span>
    <h1>Latih soalmu, ukur kesiapanmu.</h1>
    <p>Simulasi ${TOTAL} soal pilihan ganda Bahasa Indonesia SMA/MA IPA (naskah UN 2017/2018) dengan timer, penanda ragu-ragu, nilai akhir, dan pembahasan tiap soal.</p>
    <div class="facts"><span>${TOTAL} soal</span><span>${DURATION_MIN} menit</span><span>Pilihan A–E</span><span>Pembahasan lengkap</span></div>
  </section>
  <div class="start-grid">
    <form class="card" id="f" novalidate>
      <h2>Data Peserta</h2>
      ${canResume?`<div class="resume"><b>Ujian sebelumnya belum selesai.</b><br>Sisa waktu ${fmt(Math.round((saved.endAt-Date.now())/1000))} untuk ${esc(saved.student.nama)}.<div class="topbtns"><button type="button" class="btn btn-primary" id="resume">Lanjutkan ujian</button></div></div>`:''}
      <div class="field"><label for="nama">Nama Siswa</label><input id="nama" autocomplete="name" placeholder="Contoh: Aisyah Putri Rahma" required><span class="err" id="e-nama"></span></div>
      <div class="field"><label for="kelas">Kelas</label>
        <select id="kelas" required><option value="">Pilih kelas</option><option>X</option><option>XI</option><option>XII IPA</option><option>XII IPS</option><option>XII Bahasa</option><option>Lainnya</option></select><span class="err" id="e-kelas"></span></div>
      <div class="field"><label for="nopes">Nomor Peserta Didik (NISN)</label><input id="nopes" inputmode="numeric" placeholder="Contoh: 0051234567" required><span class="err" id="e-nopes"></span></div>
      <div class="field"><label for="sekolah">Asal Sekolah</label><input id="sekolah" autocomplete="organization" placeholder="Contoh: SMA Negeri 1 Bandung" required><span class="err" id="e-sekolah"></span></div>
      <button class="btn btn-primary" type="submit" style="width:100%">Mulai Try Out →</button>
    </form>
    <aside class="card">
      <h2>Petunjuk</h2>
      <ul class="rules">
        <li><i class="chip"></i><span><b>Belum dijawab</b><br>Nomor berwarna putih.</span></li>
        <li><i class="chip ok"></i><span><b>Sudah dijawab</b><br>Nomor berwarna hijau.</span></li>
        <li><i class="chip dt"></i><span><b>Ragu-ragu</b><br>Tekan tombol Ragu-ragu agar nomor berwarna kuning dan bisa dicek ulang.</span></li>
        <li><i class="chip cur"></i><span><b>Soal yang sedang dibuka</b><br>Diberi bingkai ungu.</span></li>
      </ul>
      <p style="color:var(--muted);font-size:14px;margin:18px 0 0">Waktu berjalan sejak tombol Mulai ditekan. Saat waktu habis, jawaban dikirim otomatis. Tiap jawaban benar bernilai sama, tidak ada pengurangan untuk jawaban salah.</p>
    </aside>
  </div>`;
  const f=$('#f');
  if(canResume) $('#resume').onclick=()=>{ S=saved; startTimer(); go('exam'); };
  f.addEventListener('submit',e=>{ e.preventDefault();
    const v={nama:$('#nama').value.trim(),kelas:$('#kelas').value,nopes:$('#nopes').value.trim(),sekolah:$('#sekolah').value.trim()};
    let ok=true; const must={nama:'Isi nama siswa.',kelas:'Pilih kelas.',nopes:'Isi nomor peserta didik.',sekolah:'Isi asal sekolah.'};
    for(const k in must){ $('#e-'+k).textContent = v[k]?'':must[k]; if(!v[k]) ok=false; }
    if(!ok) return;
    S={ stage:'exam', student:v, answers:{}, doubt:{}, cur:1, startedAt:Date.now(), endAt:Date.now()+DURATION_MIN*60000, result:null, filter:'all' };
    save(); startTimer(); go('exam');
  });
}

/* ---------- exam ---------- */
function renderExam(){
  const q=QUESTIONS[S.cur-1], c=counts(), cur=S.answers[S.cur], isLast=S.cur===TOTAL;
  app.innerHTML = `
  <header class="topbar">
    <div class="who"><b>${esc(S.student.nama)}</b><small>Kelas ${esc(S.student.kelas)} · ${esc(S.student.sekolah)}</small></div>
    <div class="timer" id="timer" role="timer" aria-live="off"><small>Sisa waktu</small><b id="tv">--:--</b></div>
  </header>
  <div class="progress" aria-hidden="true"><i style="width:${(c.a+c.d)/TOTAL*100}%"></i></div>
  <div class="exam-grid">
    <main class="card">
      <div class="qhead"><span class="qno">Soal ${S.cur} <span style="font-weight:600;opacity:.7">/ ${TOTAL}</span></span>
        <span class="badge ${status(S.cur)}">${{ok:'Sudah dijawab',dt:'Ragu-ragu',bl:'Belum dijawab'}[status(S.cur)]}</span></div>
      ${stimHTML(q)}
      <p class="q">${q.q}</p>
      <div class="opts" role="radiogroup" aria-label="Pilihan jawaban">
        ${Object.keys(q.opts).map(L=>`<button type="button" class="opt" role="radio" aria-checked="${cur===L}" data-l="${L}"><span class="l">${L}</span><span class="t">${q.opts[L]}</span></button>`).join('')}
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="prev" ${S.cur===1?'disabled':''}>← Sebelumnya</button>
        <button class="btn btn-doubt mid" id="doubt" aria-pressed="${!!S.doubt[S.cur]}">${S.doubt[S.cur]?'✓ Ragu-ragu':'Ragu-ragu'}</button>
        ${isLast?`<button class="btn btn-ok" id="finish2">Selesai ✓</button>`:`<button class="btn btn-primary" id="next">Selanjutnya →</button>`}
      </div>
    </main>
    <aside class="card side">
      <h2 style="font-size:18px;margin-bottom:12px">Navigasi Soal</h2>
      <div class="navgrid">${Array.from({length:TOTAL},(_,i)=>{const n=i+1;return `<button class="nb ${status(n)} ${n===S.cur?'cur':''}" data-n="${n}" aria-label="Soal ${n}, ${{ok:'sudah dijawab',dt:'ragu-ragu',bl:'belum dijawab'}[status(n)]}">${n}</button>`}).join('')}</div>
      <div class="legend">
        <div><i class="chip ok"></i>Sudah dijawab<b>${c.a}</b></div>
        <div><i class="chip dt"></i>Ragu-ragu<b>${c.d}</b></div>
        <div><i class="chip"></i>Belum dijawab<b>${c.b}</b></div>
      </div>
      <button class="btn btn-primary finish" id="finish">Akhiri Try Out</button>
    </aside>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ S.answers[S.cur]=b.dataset.l; save(); renderExam(); });
  app.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.n; save(); renderExam(); scrollTo({top:0}); });
  $('#prev').onclick=()=>{ S.cur--; save(); renderExam(); scrollTo({top:0}); };
  $('#doubt').onclick=()=>{ if(S.doubt[S.cur]) delete S.doubt[S.cur]; else S.doubt[S.cur]=true; save(); renderExam(); };
  const nx=$('#next'); if(nx) nx.onclick=()=>{ S.cur++; save(); renderExam(); scrollTo({top:0}); };
  const f2=$('#finish2'); if(f2) f2.onclick=confirmFinish;
  $('#finish').onclick=confirmFinish;
  updateTimer();
}
function confirmFinish(){
  const c=counts(); const m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="box"><h3>Akhiri Try Out?</h3><p style="margin:0;color:var(--muted)">Setelah diakhiri, jawaban tidak dapat diubah.</p>
  <ul class="sumlist"><li><span>Sudah dijawab</span><b>${c.a}</b></li><li><span>Ragu-ragu</span><b>${c.d}</b></li><li><span>Belum dijawab</span><b>${c.b}</b></li></ul>
  ${(c.d+c.b)?`<p style="margin:12px 0 0;color:var(--bad);font-weight:600">Masih ada ${c.d+c.b} soal yang belum pasti.</p>`:''}
  <div class="row"><button class="btn btn-ghost" id="mback">Kembali mengerjakan</button><button class="btn btn-primary" id="mok">Ya, akhiri</button></div></div>`;
  document.body.appendChild(m); $('#mback',m).focus();
  $('#mback',m).onclick=()=>m.remove(); $('#mok',m).onclick=()=>{ m.remove(); finish(); };
}
function startTimer(){ clearInterval(tick); tick=setInterval(()=>{ if(S.stage!=='exam') return; updateTimer(); },1000); }
function updateTimer(){
  const left=Math.round((S.endAt-Date.now())/1000); const tv=$('#tv');
  if(tv){ tv.textContent=fmt(left); $('#timer').classList.toggle('low',left<=300); }
  if(left<=0 && S.stage==='exam') finish(true);
}

/* ---------- result ---------- */
function finish(auto){
  clearInterval(tick);
  let benar=0,salah=0,kosong=0;
  QUESTIONS.forEach(q=>{ const a=S.answers[q.no]; if(!a) kosong++; else if(a===q.key) benar++; else salah++; });
  const used=Math.min(DURATION_MIN*60,Math.round((Date.now()-S.startedAt)/1000));
  S.result={benar,salah,kosong,nilai:Math.round(benar/TOTAL*10000)/100,used,auto:!!auto}; S.stage='result'; save(); go('result');
}
function renderResult(){
  const r=S.result, st=S.student;
  const verdict = r.nilai>=80?'Hebat! Pertahankan.':r.nilai>=60?'Cukup baik. Pelajari pembahasan soal yang salah.':'Masih perlu latihan. Mulai dari pembahasan di bawah.';
  const state = q=>{ const a=S.answers[q.no]; return !a?'empty':a===q.key?'good':'wrong'; };
  app.innerHTML=`
  <section class="res-hero">
    <div class="score"><div><b>${String(r.nilai).replace('.',',')}</b><small>Nilai akhir</small></div></div>
    <div style="min-width:0"><h1>${esc(st.nama)}</h1>
      <p style="margin:6px 0 0;opacity:.95">${verdict}${r.auto?' (Waktu habis, jawaban dikirim otomatis.)':''}</p>
      <div class="idgrid"><div><small>Kelas</small><b>${esc(st.kelas)}</b></div><div><small>Asal Sekolah</small><b>${esc(st.sekolah)}</b></div><div><small>No. Peserta Didik</small><b>${esc(st.nopes)}</b></div><div><small>Waktu dipakai</small><b>${fmt(r.used)}</b></div></div></div>
  </section>
  <div class="stats">
    <div class="stat ok"><b>${r.benar}</b>Jawaban benar</div><div class="stat bad"><b>${r.salah}</b>Jawaban salah</div><div class="stat bl"><b>${r.kosong}</b>Tidak dijawab</div><div class="stat"><b>${TOTAL}</b>Total soal</div>
  </div>
  <div class="card"><h2 style="font-size:18px;margin-bottom:12px">Ringkasan per Nomor</h2>
    <div class="navgrid" style="grid-template-columns:repeat(auto-fill,minmax(44px,1fr))">${QUESTIONS.map(q=>`<button class="nb ${state(q)}" data-jump="${q.no}" aria-label="Soal ${q.no}">${q.no}</button>`).join('')}</div>
    <div class="legend" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div><i class="chip ok"></i>Benar</div><div><i class="chip" style="background:var(--bad);border-color:var(--bad)"></i>Salah</div><div><i class="chip" style="background:var(--surface2)"></i>Kosong</div></div></div>
  <div class="tabs" role="group" aria-label="Filter pembahasan">
    ${[['all','Semua ('+TOTAL+')'],['good','Benar ('+r.benar+')'],['wrong','Salah ('+r.salah+')'],['empty','Kosong ('+r.kosong+')']].map(([k,l])=>`<button class="tab" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}
  </div>
  <h2 style="margin-bottom:14px">Pembahasan Soal</h2>
  <div id="review">${QUESTIONS.filter(q=>S.filter==='all'||state(q)===S.filter).map(q=>{
    const a=S.answers[q.no], s=state(q);
    return `<article class="card rev" id="rev-${q.no}">
      <div class="qhead"><span class="qno">Soal ${q.no}</span><span class="badge ${s==='good'?'ok':s==='wrong'?'bad':'bl'}">${s==='good'?'Benar':s==='wrong'?'Salah · jawabanmu '+a:'Tidak dijawab'}</span></div>
      ${stimHTML(q)}<p class="q">${q.q}</p>
      <div class="opts">${Object.keys(q.opts).map(L=>`<div class="opt ${L===q.key?'key':''} ${a===L&&L!==q.key?'mine':''}"><span class="l">${L}</span><span class="t">${q.opts[L]}</span>${L===q.key?'<span class="tagr">Kunci</span>':a===L?'<span class="tagr">Jawabanmu</span>':''}</div>`).join('')}</div>
      <div class="pemb"><h4>Pembahasan · Jawaban ${q.key}</h4><p>${q.exp}</p></div></article>`;}).join('')||'<div class="card">Tidak ada soal pada kategori ini.</div>'}</div>
  <div class="topbtns"><button class="btn btn-primary" id="again">Ulangi Try Out</button><button class="btn btn-ghost" id="top">Ke atas ↑</button></div>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; save(); renderResult(); });
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ S.filter='all'; renderResult(); const el=$('#rev-'+b.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  $('#again').onclick=()=>{ clearSaved(); S={ stage:'start', student:null, answers:{}, doubt:{}, cur:1, endAt:0, startedAt:0, result:null, filter:'all' }; go('start'); };
  $('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
}

function go(stage){ S.stage=stage; ({start:renderStart,exam:renderExam,result:renderResult})[stage](); scrollTo({top:0}); }
$('#themeBtn').onclick=()=>{ const r=document.documentElement; const dark = r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; };

(function boot(){
  const sv=load();
  if(sv && sv.stage==='result' && sv.result){ S=sv; renderResult(); }
  else if(sv && sv.stage==='exam' && sv.endAt>Date.now()){ renderStart(); }
  else renderStart();
})();
</script>

</body></html>
